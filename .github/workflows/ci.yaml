name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  UPSTREAM_IMAGE: quay.io/kubevirt/kubevirt-cloud-controller-manager
  MIRROR_IMAGE: ghcr.io/the-it-dept/kubevirt-cloud-controller-manager
  SYNCER_IMAGE: ghcr.io/the-it-dept/vcluster-private-cloud-controller
  CSI_NODE_IMAGE: ghcr.io/the-it-dept/vcluster-private-cloud-controller-csi-node
  CCM_CHART_DIR: charts/vcluster-private-cloud-controller
  SYNCER_CHART_DIR: charts/tenant-syncer

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint charts
        run: |
          helm lint "$CCM_CHART_DIR" --values "$CCM_CHART_DIR/ci/test-values.yaml"
          helm lint "$SYNCER_CHART_DIR" --values "$SYNCER_CHART_DIR/ci/test-values.yaml"
      - name: Template tests
        run: |
          pip install pyyaml
          bash hack/template-test.sh
          bash hack/template-test-syncer.sh

  build-image:
    if: github.event_name == 'push'
    needs: [go-test, lint-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SYNCER_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The CSI node plugin image: same source, `csi-node` target (Alpine with
      # filesystem tools). Published alongside the controller with matching
      # tags so one version string pins both halves of the split driver.
      - id: meta-csi
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CSI_NODE_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: csi-node
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-csi.outputs.tags }}
          labels: ${{ steps.meta-csi.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Mirror the pinned upstream CCM image (tag = 0.x chart appVersion) so the
  # deprecated chart keeps working without depending on quay availability.
  mirror-image:
    if: github.event_name == 'push'
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: imjasonh/setup-crane@v0.4
      - name: Mirror upstream image to ghcr.io
        run: |
          set -euo pipefail
          TAG="$(awk '/^appVersion:/ {print $2}' "$CCM_CHART_DIR/Chart.yaml")"
          echo "Mirroring $UPSTREAM_IMAGE:$TAG -> $MIRROR_IMAGE:$TAG"
          crane auth login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          crane copy "$UPSTREAM_IMAGE:$TAG" "$MIRROR_IMAGE:$TAG"

  publish-charts:
    if: github.event_name == 'push'
    needs: [go-test, lint-test, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Push charts to ghcr.io
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "$CCM_CHART_DIR" -d /tmp/chart-out
          helm package "$SYNCER_CHART_DIR" -d /tmp/chart-out
          for c in /tmp/chart-out/*.tgz; do
            helm push "$c" oci://ghcr.io/the-it-dept/charts
          done
