name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  UPSTREAM_IMAGE: quay.io/kubevirt/kubevirt-cloud-controller-manager
  MIRROR_IMAGE: ghcr.io/the-it-dept/kubevirt-cloud-controller-manager
  CHART_DIR: charts/vcluster-private-cloud-controller

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint "$CHART_DIR" --values "$CHART_DIR/ci/test-values.yaml"
      - name: Template tests
        run: |
          pip install pyyaml
          bash hack/template-test.sh

  # Mirror the pinned upstream image (tag = chart appVersion) to ghcr.io so
  # deployments don't depend on quay availability. crane preserves the
  # multi-arch manifest list; re-running on an existing tag is a no-op copy.
  mirror-image:
    if: github.event_name == 'push'
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: imjasonh/setup-crane@v0.4
      - name: Mirror upstream image to ghcr.io
        run: |
          set -euo pipefail
          TAG="$(awk '/^appVersion:/ {print $2}' "$CHART_DIR/Chart.yaml")"
          echo "Mirroring $UPSTREAM_IMAGE:$TAG -> $MIRROR_IMAGE:$TAG"
          crane auth login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          crane copy "$UPSTREAM_IMAGE:$TAG" "$MIRROR_IMAGE:$TAG"

  publish-chart:
    if: github.event_name == 'push'
    needs: [lint-test, mirror-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Push chart to ghcr.io
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "$CHART_DIR" -d /tmp/chart-out
          helm push /tmp/chart-out/*.tgz oci://ghcr.io/the-it-dept/charts
