image:
  repository: ghcr.io/the-it-dept/vcluster-private-cloud-controller
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# The storage syncer deploys a CSI node plugin DaemonSet INTO each guest whose
# TenantCluster has storage enabled and at least one host StorageClass is
# labelled vcluster.the-it-dept.io/tenant-offerable=true. These are the images
# it deploys there. The node image tag defaults to the chart's appVersion so
# both halves of the split driver ship as one version.
csiNode:
  image:
    repository: ghcr.io/the-it-dept/vcluster-private-cloud-controller-csi-node
    tag: ""
  registrarImage: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0

# How often each guest cluster is fully re-synced. Host-side changes (LB
# address assignment) are watched and act immediately; this bounds how long a
# change made INSIDE a guest waits.
pollInterval: 15s

replicas: 1

# Leader election matters only above one replica.
leaderElection: false

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Extra labels for all rendered resources.
commonLabels: {}
