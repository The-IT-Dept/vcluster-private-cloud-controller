{{- if .Values.rbac.create }}
{{- /*
The controller's only host-cluster writes are Services in each guest's VM
namespace (the LoadBalancer Services it materialises). Grant exactly that,
per distinct vmNamespace, rather than anything cluster-wide.
*/}}
{{- $namespaces := list }}
{{- range .Values.clusters }}
{{- if not (has .vmNamespace $namespaces) }}
{{- $namespaces = append $namespaces .vmNamespace }}
{{- end }}
{{- end }}
{{- range $ns := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vpcc.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "vpcc.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vpcc.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "vpcc.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vpcc.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vpcc.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
